[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kja-dashboard"
version = "0.1.0"
description = "NiceGUI Markdown and UI work dashboard"
requires-python = ">=3.11"
dependencies = ["nicegui>=3.19,<4", "httpx>=0.27,<1", "python-dotenv>=1,<2", "PyYAML>=6,<7", "playwright>=1.51,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "pyftpdlib>=2,<3"]

[project.scripts]
kja-dashboard = "app.main:run"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
main_file = ""


[tool.setuptools.package-data]
app = ["common/*.js", "common/calendar_vendor/*.js", "common/calendar_vendor/*LICENSE*", "common/calendar_vendor/README.md"]
